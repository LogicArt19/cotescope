<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-mJCHY7GRAulC98q/x73XyXKjcZ43vtdgU5B03ZGssyU=' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.workers.dev https://api.cotescope.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060A12">
<link rel="apple-touch-icon" href="../img/logo.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cotescope">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060A12">
<title>Cotescope</title>
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#060A12; --deck:#0C1220; --deck2:#111A2C; --rim:#1B2740; --rim2:#26355A;
  --chalk:#E8EEF8; --fog:#8593AD; --dim:#5C6A86;
  --home:#26E0B8; --draw:#F2B84B; --away:#9C8CFF; --bad:#FF6B7A;
  --disp:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 420px at 15% -8%,rgba(38,224,184,.10),transparent 60%),
             radial-gradient(800px 420px at 90% -10%,rgba(156,140,255,.10),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--home)}
:focus-visible{outline:2px solid var(--home);outline-offset:2px;border-radius:8px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
[hidden]{display:none!important}

/* ---------- barre 1N2 : l'élément signature ---------- */
.spec{display:flex;height:8px;border-radius:6px;overflow:hidden;gap:2px;background:var(--rim)}
.spec i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.spec .h{background:var(--home);box-shadow:0 0 12px rgba(38,224,184,.5)}
.spec .d{background:var(--draw)}
.spec .a{background:var(--away);box-shadow:0 0 12px rgba(156,140,255,.45)}
.spec.big{height:14px;border-radius:8px}
.specl{display:flex;justify-content:space-between;font-family:var(--disp);font-size:13px;margin-top:5px}
.specl .h{color:var(--home)}.specl .d{color:var(--draw)}.specl .a{color:var(--away)}

/* ---------- structure ---------- */
.shell{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:0 28px;height:64px;
  background:rgba(6,10,18,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--rim)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--chalk);font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.02em}
.logo img{width:30px;height:30px}
nav.tabs{display:flex;gap:4px;margin-left:12px}
nav.tabs button{padding:9px 14px;border-radius:10px;color:var(--fog);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;position:relative}
nav.tabs button:hover{color:var(--chalk);background:var(--deck)}
nav.tabs button.on{color:var(--chalk);background:var(--deck2)}
nav.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-12px;height:2px;background:var(--home);border-radius:2px;box-shadow:0 0 10px var(--home)}
nav.tabs svg{width:17px;height:17px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--home);color:#04201A;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.sp{flex:1}
.plan{font-family:var(--disp);font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--rim2);color:var(--fog)}
.plan.p-pro,.plan.p-elite{border-color:rgba(38,224,184,.5);color:var(--home)}
.me{width:36px;height:36px;border-radius:50%;background:var(--deck2);border:1px solid var(--rim2);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:var(--chalk)}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:26px 28px 90px}
.bottom{display:none}

h1.t{font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:.01em;margin-bottom:4px}
p.lead{color:var(--fog);max-width:62ch;margin-bottom:22px}
h2.s{font-family:var(--disp);font-size:17px;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.s small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--dim)}

.panel{background:linear-gradient(180deg,var(--deck),rgba(12,18,32,.75));border:1px solid var(--rim);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:14.5px;border:1px solid var(--rim2);background:var(--deck2);transition:border-color .15s,background .15s}
.btn:hover{border-color:#3A4C78}
.btn.go{background:var(--sp,var(--home));border-color:var(--sp,var(--home));color:#071017}
.btn.go:hover{background:color-mix(in srgb,var(--sp,var(--home)) 82%,white)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;padding:11px 13px;border-radius:11px;background:var(--night);border:1px solid var(--rim2);color:var(--chalk);font-size:15px}
.in:focus{outline:none;border-color:var(--home)}
label.f{display:block;font-size:13px;color:var(--fog);margin-bottom:6px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:10px;border:1px solid var(--rim);background:var(--deck);color:var(--fog);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip b{font-family:var(--disp);color:var(--dim);margin-left:6px;font-weight:600}
.chip.on{border-color:var(--home);color:var(--chalk);background:rgba(38,224,184,.08)}
.chip.on b{color:var(--home)}
.chip.lk{opacity:.45;border-style:dashed}
.empty{padding:40px 24px;text-align:center;color:var(--fog)}
.empty b{display:block;color:var(--chalk);font-size:16px;margin-bottom:6px}
.note{font-size:13px;color:var(--fog)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--deck2);color:var(--fog)}
.pill.ok{color:var(--home);background:rgba(38,224,184,.1)}
.pill.warn{color:var(--draw);background:rgba(242,184,75,.1)}
.pill.bad{color:var(--bad);background:rgba(255,107,122,.1)}
.pill.v{color:var(--away);background:rgba(156,140,255,.12)}

/* ---------- jour ---------- */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 14px;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:74px;padding:9px 10px;border-radius:12px;border:1px solid var(--rim);background:var(--deck);text-align:center}
.day .w{font-size:12px;color:var(--fog);font-weight:600}
.day .n{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.2}
.day .c{font-size:11.5px;color:var(--dim)}
.day.on{border-color:var(--home);background:rgba(38,224,184,.07)}
.day.on .c{color:var(--home)}

/* ---------- match ---------- */
.lg{display:flex;align-items:center;gap:10px;margin:22px 0 8px;color:var(--fog);font-size:13px;font-weight:700}
.lg::after{content:"";flex:1;height:1px;background:var(--rim)}
.match{display:grid;grid-template-columns:62px minmax(0,1.25fr) minmax(170px,1fr) auto 24px;gap:18px;align-items:center;padding:14px 18px;border-radius:var(--r);border:1px solid var(--rim);background:var(--deck);cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s}
.match:hover{border-color:var(--rim2);background:var(--deck2)}
.match .tm{font-family:var(--disp);font-size:16px;font-weight:600}
.match .tm small{display:block;font-family:var(--body);font-size:11.5px;color:var(--dim);font-weight:500}
.teams div{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams div+div{margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.h{background:var(--home)}.dot.a{background:var(--away)}
.form{display:inline-flex;gap:2px;margin-left:6px}
.form i{width:6px;height:6px;border-radius:2px;background:var(--dim)}
.form i.V{background:var(--home)}.form i.N{background:var(--draw)}.form i.D{background:var(--bad)}
.odds3{display:flex;gap:6px}
.ob{min-width:58px;padding:6px 8px;border-radius:10px;border:1px solid var(--rim2);background:var(--night);text-align:center;transition:border-color .15s}
.ob small{display:block;font-size:10.5px;color:var(--dim);font-weight:700}
.ob b{font-family:var(--disp);font-size:15px}
.ob:hover{border-color:var(--home)}
.ob.in{border-color:var(--home);background:rgba(38,224,184,.12)}
.chev{color:var(--dim)}

/* ---------- page match ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fog);font-weight:600;margin-bottom:14px}
.mhead{padding:26px 28px}
.mhead .meta{color:var(--fog);font-size:13.5px;margin-bottom:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:22px}
.vs .tn{font-family:var(--disp);font-size:clamp(20px,3.4vw,32px);font-weight:700;line-height:1.1}
.vs .tn.r{text-align:right}
.vs .x{font-family:var(--disp);color:var(--dim);font-size:15px}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--rim);margin:22px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{padding:11px 14px;color:var(--fog);font-weight:700;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs2 button.on{color:var(--chalk);border-color:var(--home)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{padding:18px 20px}
.box h3{font-family:var(--disp);font-size:15px;font-weight:600;margin-bottom:12px}
table.src{width:100%;border-collapse:collapse;font-size:14px}
table.src td,table.src th{padding:9px 6px;border-bottom:1px solid var(--rim);text-align:right}
table.src th{color:var(--dim);font-weight:600;font-size:12.5px}
table.src td:first-child,table.src th:first-child{text-align:left}
table.src tr.fin td{font-weight:700;color:var(--chalk);border-bottom:0}
.args li{list-style:none;padding:7px 0;border-bottom:1px solid var(--rim);font-size:14px}
.args li:last-child{border:0}
.rel{height:6px;border-radius:4px;background:var(--rim);overflow:hidden;margin:8px 0 4px}
.rel i{display:block;height:100%}
.yo{width:70px;padding:7px 8px;border-radius:9px;background:var(--night);border:1px solid var(--rim2);color:var(--chalk);font:600 14px var(--disp);text-align:center}
.yo:focus{outline:none;border-color:var(--home)}
.vd:empty{display:none}.vd{margin-top:6px}
.fresh{margin:-12px 0 18px}
.bet{display:grid;grid-template-columns:minmax(0,1fr) 120px 74px 74px 34px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--rim)}
.bet:last-child{border:0}
.bet .sel{font-weight:600}
.bet .sel small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.pbar{height:5px;border-radius:3px;background:var(--rim);overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:var(--home)}
.bet .o{font-family:var(--disp);font-size:17px;font-weight:700;text-align:right}
.bet .o small{display:block;font-family:var(--body);font-size:11px;color:var(--dim);font-weight:600}
.add{width:32px;height:32px;border-radius:9px;border:1px solid var(--rim2);display:grid;place-items:center;font-size:18px;color:var(--fog)}
.add:hover{border-color:var(--home);color:var(--home)}
.add.in{background:var(--home);border-color:var(--home);color:#032019}
.add.rm{font-size:20px;line-height:1}
.add.rm:hover{border-color:var(--bad);color:var(--bad)}
.lastg{display:flex;gap:6px;flex-wrap:wrap}
.lastg span{font-size:12px;padding:4px 7px;border-radius:7px;background:var(--night);border:1px solid var(--rim)}
.lastg span.V{border-color:rgba(38,224,184,.5)}.lastg span.D{border-color:rgba(255,107,122,.5)}.lastg span.N{border-color:rgba(242,184,75,.5)}

/* ---------- verrou ---------- */
.lock{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r);border:1px dashed rgba(242,184,75,.45);background:rgba(242,184,75,.05);margin:12px 0}
.lock .ic{width:34px;height:34px;border-radius:10px;background:rgba(242,184,75,.12);display:grid;place-items:center;color:var(--draw);flex:none}
.lock b{display:block;font-size:14.5px}
.lock small{color:var(--fog);font-size:13px}
.lock .btn{margin-left:auto;flex:none}

/* ---------- pronostics / objectif / ticket ---------- */
.pick{display:grid;grid-template-columns:minmax(0,1fr) 150px 80px 34px;gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--rim);background:var(--deck);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.pick:hover{border-color:var(--rim2)}
.pick .sel{font-weight:700;font-size:15px}
.pick .sel small{display:block;font-weight:500;color:var(--fog);font-size:13px}
.goal{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.gx{position:relative;margin:0 0 22px;padding:22px 24px;border-radius:20px;border:1px solid var(--rim);background:radial-gradient(120% 140% at 0% 0%,var(--spbg),transparent 55%),var(--deck);overflow:hidden}
.gx-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.gx-tag{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;background:var(--spbg);border:1px solid color-mix(in srgb,var(--sp) 40%,transparent);font-weight:700;font-size:13px;color:var(--chalk)}
.gx-tag .d{width:7px;height:7px;border-radius:50%;background:var(--sp);box-shadow:0 0 8px var(--sp)}
.gx-sent{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--disp);font-size:clamp(22px,3vw,32px);font-weight:700;color:var(--chalk)}
.gx-in{display:inline-flex;align-items:baseline;gap:4px;padding:4px 14px;border-radius:14px;border:1px solid var(--rim2);background:rgba(0,0,0,.25);cursor:text;transition:border-color .15s}
.gx-in:focus-within{border-color:var(--sp)}
.gx-in input{width:4ch;min-width:2ch;max-width:7ch;border:0;outline:0;background:transparent;color:var(--sp);font:inherit;text-align:right;field-sizing:content}
.gx-in i{font-style:normal;color:var(--fog);font-size:.7em}
.gx-go{margin-left:auto;font-family:var(--body,inherit);font-size:15px;padding:13px 22px}
.gx-need{margin-top:10px;color:var(--fog);font-size:14.5px}.gx-need b{color:var(--chalk)}
.gx-f{margin-top:18px;border-top:1px solid var(--rim);padding-top:14px}
.gx-f summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none;cursor:pointer}
.gx-f summary::-webkit-details-marker{display:none}
.gx-f summary span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--rim);background:rgba(255,255,255,.02);font-size:13px;font-weight:600;color:var(--chalk)}
.gx-f summary span small{color:var(--fog);font-weight:500}
.gx-f summary em{margin-left:auto;font-style:normal;font-weight:700;font-size:13.5px;color:var(--sp)}
.gx-f summary em::after{content:" ▾"}.gx-f[open] summary em::after{content:" ▴"}
.gx-rows{display:grid;gap:12px;margin-top:16px}
.gx-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.gx-row>label{padding-top:7px;font-size:13px;font-weight:600;color:var(--fog)}
.gx-row .tgl{display:flex;flex-wrap:wrap;gap:6px}
.gx-mm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.gx-mm .in{width:76px;padding:8px 10px}
.ourcall{margin-bottom:14px;border-color:color-mix(in srgb,var(--sp) 40%,var(--rim));background:radial-gradient(120% 140% at 0% 0%,var(--spbg),transparent 60%),var(--deck)}
.oc-score{display:flex;gap:12px;flex-wrap:wrap}.oc-score>div{flex:1 1 200px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--rim)}
.oc-score small{display:block;color:var(--fog);font-size:12px;margin-bottom:3px}.oc-score b{color:var(--chalk);font-size:16px}
.oc-list{display:grid;gap:6px}.oc-row{display:grid;grid-template-columns:12px minmax(0,1fr) 120px 48px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rim)}
.oc-row:last-child{border-bottom:0}.oc-row small{display:block;color:var(--fog);font-size:12px}.oc-row .num{text-align:right;color:var(--sp)}
.oc-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}.oc-bar i{display:block;height:100%;background:var(--sp)}
.tsw+.tsw{margin-left:8px}
.tblw{margin-bottom:14px}.tscroll{overflow-x:auto}
table.stand{width:100%;border-collapse:collapse;font-size:13.5px}table.stand th{text-align:left;color:var(--fog);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--rim)}
table.stand td{padding:8px 6px;border-bottom:1px solid var(--rim);white-space:nowrap;text-align:center}table.stand td:nth-child(2),table.stand th:nth-child(2){text-align:left}table.stand th{text-align:center}table.stand td.tn{font-weight:600;color:var(--chalk);width:40%}
table.stand tr.hl td{background:var(--spbg)}table.stand td.up{color:var(--home)}table.stand td.down{color:var(--bad)}
table.cmpt td.num{text-align:right;font-weight:700;color:var(--chalk)}
.ourrow{padding:14px 16px;margin-bottom:10px;cursor:pointer}.ourrow:hover{border-color:var(--rim2)}
.or-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.or-h small{display:block;color:var(--fog);font-size:12px;margin-top:2px}
.or-f{text-align:right}.or-f b{display:block;color:var(--chalk)}.or-f em{font-style:normal;color:var(--sp);font-weight:800}
.or-s{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.or-s span{padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--rim)}
.or-s small{display:block;font-size:11px;color:var(--fog)}.or-s b{color:var(--chalk)}
.or-sc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}.or-sc>small{color:var(--fog)}
.or-sc span{display:inline-flex;align-items:center;gap:6px}.or-sc b{color:var(--sp)}.or-sc .dot{display:inline-block}
details.omg{border-top:1px solid var(--rim);padding:10px 0}details.omg summary{cursor:pointer;font-weight:700;color:var(--chalk);list-style:none}details.omg summary::-webkit-details-marker{display:none}details.omg summary::before{content:"▸ ";color:var(--sp)}details.omg[open] summary::before{content:"▾ "}
.omk{grid-template-columns:minmax(0,1fr) 170px}@media (max-width:900px){.omk{grid-template-columns:1fr}.omk .pc{max-width:220px}}.omk[data-go]{cursor:pointer}
.gkind{color:var(--sp);font-weight:600}
.gtool{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0 16px;padding:12px 14px;border-radius:14px;border:1px solid var(--rim);background:var(--deck)}
.gtool label{display:flex;flex-direction:column;gap:4px}.gtool label small{font-size:11.5px;color:var(--fog);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.gtool .sel2{min-width:150px}.gtool .gcount{margin-left:auto;padding-bottom:9px}

const lsSet = v => { try { v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS); } catch(e) {} };

async function server(path, method, body, raw){
  if (!CFG.api) return {ok:false, reason:"server_not_configured"};
  let r;
  try {
    r = await fetch(CFG.api.replace(/\/$/, "") + path, {method: method||"GET", cache:"no-store",
      headers: Object.assign(SESSION ? {Authorization:"Bearer " + SESSION} : {}, body ? {"Content-Type":"application/json"} : {}),
      body: body ? JSON.stringify(body) : undefined});
  } catch(e) { return {ok:false, reason:"network"}; }
  if (raw && r.ok) return r;
  let j = {}; try { j = await r.json(); } catch(e) { j = {ok:false, reason:"http_" + r.status}; }
  if (!r.ok && j.ok === undefined) j.ok = false;
  if (j.reason === "session") { lsSet(""); SESSION = ""; }
  return j;
}
function keep(r){
  if (r && r.session) { SESSION = r.session; lsSet(SESSION); }
  if (r && r.ok && r.email) ACCOUNT = {email:r.email, tier:r.tier, status:r.status, renews:r.renews, cancel:r.cancel, manage:r.manage, pause:r.pause || null, tg:!!r.tg, tg_bot:r.tg_bot || null};
  return r;
}

  forgot: e => server("/api/forgot","POST",{email:e}),
  verifyResend: () => server("/api/verify/resend","POST",{}),
  reset: async (c,p) => keep(await server("/api/reset","POST",{code:c,password:p})),

function loadScript(src){ return new Promise((ok, ko) => { const s=document.createElement("script"); s.src=src; s.crossOrigin="anonymous"; if (PYODIDE_SRI && src.endsWith("pyodide.js")) s.integrity=PYODIDE_SRI; s.onload=ok; s.onerror=()=>ko(Object.assign(new Error("network"),{reason:"network"})); document.head.appendChild(s); }); }
function persist(){ clearTimeout(saveT); saveT = setTimeout(() => { try { py.FS.syncfs(false, () => {}); } catch(e) {} }, 400); }
const READ_ONLY = /^(get_|builder_get|estimate|compute_)/;
function call(name, ...args){
  if (window.__BRIDGE__) return window.__BRIDGE__(name, args);
  const out = JSON.parse(web.call(name, JSON.stringify(args)));
  if (!READ_ONLY.test(name)) persist();
  return out;
}
async function loadSnapshot(){
  const r = await server("/api/snapshot","GET",null,true);
  if (!(r instanceof Response)) throw Object.assign(new Error(r.reason), {reason:r.reason});
  web.load_snapshot(await r.text()); nextSnap = Date.now() + 10*60*1000;
}
async function boot(){
  gate("loading", {text:"Téléchargement des données du jour…"});
  const [eng, snap] = await Promise.all([
    server("/api/engine","GET",null,true), server("/api/snapshot","GET",null,true),
    window.loadPyodide ? null : loadScript(PYODIDE + "pyodide.js")]);
  for (const r of [eng, snap]) if (!(r instanceof Response)) throw Object.assign(new Error(r.reason), {reason:r.reason});
  const files = (await eng.json()).files || {}, snapText = await snap.text();
  gate("loading", {text:"Démarrage du moteur d'analyse…"});
  if (!py) {
    py = await window.loadPyodide({indexURL: PYODIDE});
    py.FS.mkdirTree("/data"); py.FS.mount(py.FS.filesystems.IDBFS, {}, "/data");
    await new Promise(ok => py.FS.syncfs(true, () => ok()));
    py.FS.mkdirTree("/engine");
  }
  for (const [n, c] of Object.entries(files)) py.FS.writeFile("/engine/" + n, c);
  py.runPython("import sys\nif '/engine' not in sys.path: sys.path.insert(0, '/engine')\nimport webapi\nwebapi.boot()");
  web = py.pyimport("webapi");
  call("set_account", ACCOUNT);
  gate("loading", {text:"Analyse de tous les matchs…"});
  await new Promise(r => setTimeout(r, 30));
  web.load_snapshot(snapText); nextSnap = Date.now() + 10*60*1000; persist();
  SPINFO = call("set_sport", SPORT) || {};
  setInterval(tick, 60*1000);
}
async function tick(){
  if (window.__BRIDGE__) return;
  try {
    if (Date.now() >= nextSnap) { await loadSnapshot(); render(); }
    call("tick");
    if (Math.random() < .1) { const a = await Auth.me(); if (a.ok) { call("set_account", ACCOUNT); } else if (a.reason === "session") location.reload(); }
  } catch(e) { if (["session","no_plan","inactive","free_over"].includes(e.reason)) location.reload(); }
}

  if (BSET.has(uid)) { call("builder_remove", uid); BSET.delete(uid); toast("Retiré de ton ticket"); }

}

function vMatchs(){
  const days = {};
  MATCHES.forEach(m => { days[m.day] = (days[m.day] || 0) + 1; });
  const keys = Object.keys(days).sort();
  if (!DAY || !days[DAY]) DAY = keys[0] || null;
  const LG_ORDER = ["Ligue 1", "Premier League", "Liga", "Serie A", "Bundesliga", "Ligue des champions", "Ligue Europa", "Conference League", "Ligue des nations"];
  const lgRank = l => { const i = LG_ORDER.indexOf(l); return i < 0 ? 99 : i; };
  const leagues = [...new Set(MATCHES.filter(m => m.day === DAY).map(m => m.league))].sort((a, b) => lgRank(a) - lgRank(b) || a.localeCompare(b));
  if (LEAGUE !== "all" && !leagues.includes(LEAGUE)) LEAGUE = "all";
  const today = new Date().toISOString().slice(0,10);

function scorerProbs(e, i){
  const P = i.players || {}, M = i.model;
  const out = [];
  for (const [side, xgKey] of [["home", "xg_home"], ["away", "xg_away"]]) {
    const p = P[side]; if (!p || !(p.scorers || []).length) continue;
    const teamGoals = Math.max(1, p.goals || p.scorers.reduce((s, x) => s + x.g, 0));
    const xg = M && M[xgKey] ? M[xgKey] : 1.35;
    for (const x of p.scorers) {
      if (x.inj) continue;
      const share = x.g / teamGoals, regular = x.m ? Math.min(1, x.m / Math.max(4, Math.max(...p.scorers.map(y => y.m || 0)))) : .7;
      const lam = share * xg * (0.55 + 0.45 * regular);
      out.push({n: x.n, team: side === "home" ? e.home : e.away, side, p: 1 - Math.exp(-lam), g: x.g, m: x.m});
    }
  }
  return out.sort((a, b) => b.p - a.p).slice(0, 8);
}

/* ---------- optimiseur de grille Loto Foot ---------- */
let LOTO = {sel: [], unit: "1", budget: "8", res: null};
// Pour chaque match on peut cocher 1, 2 ou 3 issues. Coût = prix unitaire × 2^doubles × 3^triples.
// Programmation dynamique : la grille qui a le plus de chances d'être entièrement juste dans le budget.
function lotoSolve(matches, maxCombos){
  const opts = matches.map(m => {
    const p = m.probs.map((x, k) => ({k, p: x || 0})).sort((a, b) => b.p - a.p);
    return [{c: 1, keys: [p[0].k], p: p[0].p}, {c: 2, keys: [p[0].k, p[1].k], p: p[0].p + p[1].p}, {c: 3, keys: [0, 1, 2], p: 1}];
  });
  let dp = new Map([[1, {lp: 0, pick: []}]]);
  for (const o of opts) {
    const nx = new Map();
    for (const [cost, st] of dp) for (const x of o) {
      const c = cost * x.c; if (c > maxCombos) continue;
      const lp = st.lp + Math.log(Math.max(1e-9, x.p)), cur = nx.get(c);
      if (!cur || lp > cur.lp) nx.set(c, {lp, pick: [...st.pick, x]});
    }
    dp = nx;
  }
  let best = null; for (const [c, st] of dp) if (!best || st.lp > best.lp) best = {...st, combos: c};
  return best;
}

let TSTAKE = "10";
/* ---------- capital et mise conseillée (Elite) ---------- */
function bankNow(){ if (rank() < 3) return null; const b = call("get_bank"); return b && b.enabled ? b : null; }
// Mise conseillée : critère de Kelly fractionné si le pari est rentable sur la durée (plafonné à 3 % du capital),
// sinon 1 % maximum ; jamais plus que ce qu'il reste dans la limite du jour.
function stakeAdvice(p, odds){
  const b = bankNow(); if (!b || !p || !odds) return null;
  const cfg = call("get_config") || {}, kf = Number(cfg.kelly_fraction || .25);
  if (b.stop) return {stake: 0, txt: `Stop-loss du jour atteint (−${eur(b.stop_loss)}) : on s'arrête là pour aujourd'hui.`};
  const k = (p * odds - 1) / (odds - 1), cur = b.current;
  let pct, why;
  const ev = p * odds - 1;
  if (ev >= .02 && k > 0) { pct = Math.max(.01, Math.min(.03, kf * k)); why = `ce pari est rentable sur la durée selon nos analyses (+${fr(ev * 100, 1)} % en moyenne)`; }
  else if (ev > -.02) { pct = .01; why = "l'avantage est quasi nul : pas de raison de miser plus"; }
  else { pct = .01; why = "ce pari n'est pas rentable sur la durée (marge du bookmaker) : à jouer petit, pour le plaisir"; }
  let stake = Math.floor(cur * pct * 100) / 100;
  if (b.left_today != null) stake = Math.max(0, Math.min(stake, b.left_today));
  if (stake <= 0) return {stake: 0, txt: `Limite du jour atteinte (${eur(b.day_max)}).`};
  return {stake, txt: `Mise conseillée : <b>${eur(stake)}</b> (${fr(stake / cur * 100, 1)} % de ton capital de ${eur(cur)}), car ${why}.`};
}

  if (rank() < 3) return `<div class="panel box"><h3>Alertes Telegram</h3>${what}${lockBox("elite", "Alertes sur ton téléphone", "Reçois les compos officielles et les opportunités directement sur Telegram.")}</div>`;
  if (!a.tg_bot && !window.__BRIDGE__) return `<div class="panel box"><h3>Alertes Telegram</h3>${what}<p class="note">Les alertes ouvrent très bientôt.</p></div>`;
  return `<div class="panel box"><h3>Alertes Telegram ${a.tg ? '<span class="pill ok">activées</span>' : ""}</h3>${what}
    ${a.tg ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn go" id="tg-test">Envoyer une alerte test</button><button class="btn" id="tg-off">Arrêter les alertes</button></div>` : `<button class="btn go" id="tg-on">Recevoir les alertes sur Telegram</button><p class="note" style="margin-top:8px">Telegram s'ouvre : appuie sur « Démarrer », c'est tout.</p>`}</div>`;
}
document.addEventListener("click", async e => {
  if (e.target.closest("#tg-on")) {
    const w = window.open("about:blank", "_blank");
    const r = await Auth.tgLink();
    if (r.ok) { if (w) w.location = r.url; else location.href = r.url; toast("Appuie sur « Démarrer » dans Telegram"); setTimeout(async () => { await Auth.me(true); render(); }, 15000); }
    else { if (w) w.close(); toast(errMsg(r.reason)); }
  }
  if (e.target.closest("#tg-test")) { const r = await Auth.tgTest(); toast(r.ok ? "Alerte envoyée : regarde Telegram" : r.reason === "not_linked" ? "Relie d'abord Telegram" : "Telegram n'a pas répondu, réessaie"); }
  if (e.target.closest("#tg-off")) { const r = await Auth.tgUnlink(); if (r.ok) { ACCOUNT.tg = false; toast("Alertes arrêtées"); render(); } }
});
function capitalPanel(){
  if (rank() < 3) return `<div class="panel box"><h3>Mon capital</h3>${lockBox("elite", "Capital et mise conseillée", "Indique ton capital : Cotescope te dit combien miser sur chaque pari, avec une limite par jour et un stop-loss.")}</div>`;
  const cfg = call("get_config") || {}, b = call("get_bank") || {};
  return `<div class="panel box"><h3>Mon capital</h3>
    ${b.enabled ? `<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px"><div><small class="note">Capital actuel</small><b class="num" style="display:block;font-size:22px">${eur(b.current)}</b></div><div><small class="note">Reste à miser aujourd'hui</small><b class="num" style="display:block;font-size:22px">${b.left_today != null ? eur(b.left_today) : "–"}</b></div><div><small class="note">Résultat du jour</small><b class="num" style="display:block;font-size:22px;color:${b.today_pl>=0?"var(--home)":"var(--bad)"}">${eur(b.today_pl)}</b></div></div>` : `<p class="note" style="margin-bottom:10px">Indique ton capital de départ : il évolue tout seul avec les résultats de tes tickets.</p>`}
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <div><label class="f">Capital de départ (€)</label><input class="sel2" id="bk-s" inputmode="decimal" value="${esc(cfg.bankroll || "")}"></div>
      <div><label class="f">Mise max par jour (% du capital)</label><input class="sel2" id="bk-d" inputmode="decimal" value="${esc(cfg.daily_max_pct || 10)}"></div>
      <div><label class="f">Stop-loss par jour (€, vide = aucun)</label><input class="sel2" id="bk-l" inputmode="decimal" value="${esc(cfg.stop_loss || "")}"></div>
      <div><label class="f">Prudence</label><select class="sel2" id="bk-k">${[[.25,"Prudent (recommandé)"],[.5,"Équilibré"]].map(([v,l]) => `<option value="${v}" ${Number(cfg.kelly_fraction||.25)===v?"selected":""}>${l}</option>`).join("")}</select></div>
    </div><button class="btn go" id="bk-go" style="margin-top:10px">Enregistrer</button></div>`;
}
document.addEventListener("click", e => {
  if (!e.target.closest("#bk-go")) return;
  const n = id => parseFloat(String($(id).value).replace(",", ".")) || 0;
  call("save_config", {bankroll: n("#bk-s"), daily_max_pct: n("#bk-d") || 10, stop_loss: n("#bk-l"), kelly_fraction: n("#bk-k") || .25});
  toast("Capital enregistré"); render();
});
async function loadAdmin(){
  const box = $("#c-adm"); if (!box) return;
  const r = await Auth.adminStatus();
  if (!r.ok) { box.innerHTML = `<p class="note">${esc(errMsg(r.reason))}</p>`; return; }
  const t = r.telegram || {}, s = t.stats || {}, b = t.bot || {};
  const ago = x => { if (!x) return "jamais"; const m = Math.round((Date.now() - x) / 6e4); return m < 60 ? `il y a ${m} min` : m < 2880 ? `il y a ${Math.round(m/60)} h` : `il y a ${Math.round(m/1440)} j`; };
  const row = (k, v, ok) => `<div class="bet" style="grid-template-columns:minmax(0,1fr) auto"><div class="sel">${k}</div><b class="num" style="color:${ok===false?"var(--bad)":ok?"var(--home)":"inherit"}">${v}</b></div>`;
  const ml = r.mail || {};
  box.innerHTML = row("E-mails (confirmation, mot de passe oublié)", ml.configured ? "activés" : "pas encore activés", !!ml.configured)
    + row("Bot Telegram", !t.configured ? "non configuré" : b.webhook ? "branché" : "webhook absent", t.configured && b.webhook)
    + (b.error ? row("Dernière erreur Telegram", esc(b.error), false) : "")
    + row("Comptes reliés à Telegram", `${t.subscribers || 0}${t.by_tier ? " (" + Object.entries(t.by_tier).map(([k,v]) => `${PLAN_NAME[k]||k} ${v}`).join(", ") + ")" : ""}`)
    + row("Messages d'alerte envoyés", `${s.msgs || 0} (${s.sent || 0} réceptions)`)
    + row("Dernière alerte", ago(s.last))
    + (s.last_text ? `<p class="note" style="margin:6px 0">« ${esc(s.last_text)} »</p>` : "")
    + row("Alertes préparées par la dernière collecte", `${t.queued || 0} · ${ago(t.queue_ts)}`)
    + row("Matchs surveillés pour les compos", (r.lineups || {}).watched || 0)
    + row("Compos officielles reçues (48 h)", (r.lineups || {}).stored || 0)
    + `<p class="note" style="margin:14px 0 6px"><b>Derniers messages de l'assistant d'aide</b></p>`
    + ((r.support || []).map(m => `<div class="bet" style="grid-template-columns:1fr"><div class="sel">${esc(m.msg)}<small>${esc(m.from)} · ${ago(m.ts)} · ${esc(m.page || "")}</small></div></div>`).join("") || '<p class="note">Aucun message pour l\'instant.</p>');
}
async function loadDevices(){
  const box = $("#c-dev"); if (!box) return;
  const r = await Auth.devices();
  if (!r.ok) { box.innerHTML = `<p class="note">${esc(errMsg(r.reason))}</p>`; return; }
  const d = x => new Date(x).toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
  box.innerHTML = r.devices.map(v => `<div class="bet" style="grid-template-columns:minmax(0,1fr) auto"><div class="sel">${esc(v.name)}${v.me?' <span class="pill ok">cet appareil</span>':""}<small>depuis le ${d(v.since)}${v.country?" · "+esc(v.country):""}</small></div>${v.me?"":`<button class="btn sm" data-kick="${esc(v.id)}">Déconnecter</button>`}</div>`).join("") || '<p class="note">Aucun appareil.</p>';
}
document.addEventListener("change", e => {
  if (e.target.closest("#c-books")) {
    e.target.parentNode.classList.toggle("on", e.target.checked);
    const L = $$("#c-books input").filter(i => i.checked).flatMap(i => i.value.split(","));
    if (!L.length) { e.target.checked = true; e.target.parentNode.classList.add("on"); toast("Garde au moins un bookmaker"); return; }
    call("set_books", L); refreshState(); toast("Bookmakers enregistrés");
  }
  if (e.target.closest("#c-lg")) {
    e.target.parentNode.classList.toggle("on", e.target.checked);
    call("save_config", {hide_sports: $$("#c-lg input").filter(i => !i.checked).map(i => i.value)}); refreshState(); toast("Championnats enregistrés");
  }
});
document.addEventListener("click", async e => {
  if (e.target.closest("#c-out")) Auth.logout();
  const all = e.target.closest("#c-outall");
  if (all) { if (all.dataset.sure) Auth.logout(true); else { all.dataset.sure = 1; all.textContent = "Confirmer : tout déconnecter"; all.classList.add("go"); } }
  if (e.target.closest("[data-reload]")) location.reload();
  const k = e.target.closest("[data-kick]"); if (k) { await Auth.kick(k.dataset.kick); toast("Appareil déconnecté"); loadDevices(); }
});

/* ======================================================================
   Rendu
   ====================================================================== */
function render(){
  if (!web && !window.__BRIDGE__) return;
  refreshState();
  const r = route();
  const V = {matchs:vMatchs, tables:vTables, match:() => vMatch(r.a), picks:vPicks, goal:vGoal, lab:vLab, ticket:vTicket, bilan:vBilan, compte:vCompte};
  const paused = ACCOUNT && ACCOUNT.pause && ACCOUNT.pause > Date.now();
  const locked = SPORT !== "foot" && !SPINFO.n_events && rank() < 2;
  const TEN = "Les vraies cotes de Betclic, Winamax, Unibet et Bet365 (vainqueur, nombre de jeux), le classement, les 10 derniers matchs, la série en cours, la fatigue, les tie-breaks et le face-à-face.";
  const LOCK_TXT = {nba: "Tous les matchs NBA avec les vraies cotes de Betclic, Winamax, Unibet et Bet365 (vainqueur, total de points), les blessés, le classement et les derniers résultats de chaque franchise.",
                    atp: TEN, wta: TEN};
  const body = paused && ["picks","goal","ticket","lab"].includes(r.v) ? vPaused()
    : locked && SPORT_VIEWS.includes(r.v) ? `<h1 class="t">${SPORT_NAME[SPORT]}</h1>${lockBox("essentiel", `${SPORT_NAME[SPORT]} : inclus dans Essentiel et Pro`, LOCK_TXT[SPORT])}`
    : (V[r.v] || vMatchs)();
  $("#view").innerHTML = verifyBanner() + (SPORT_VIEWS.includes(r.v) ? tennisSwitch() : "") + (["matchs", "tables"].includes(r.v) ? matchTabs(r.v) : "") + body;
  window.__czEmail = (ACCOUNT && ACCOUNT.email) || "";
  sportTabs();
  chrome();
  if (r.v === "compte" && !window.__BRIDGE__) { loadDevices(); loadAdmin(); }
}

/* ======================================================================
   Écrans de connexion, forfaits, choix des bookmakers
   ====================================================================== */
const field = (id, label, type, ph) => `<div class="f"><label class="f" for="${id}">${label}</label><input class="in" id="${id}" type="${type||"text"}" placeholder="${ph||""}" autocomplete="${type==="password"?(id==="g-pw2"?"new-password":"current-password"):"email"}"></div>`;
function gate(v, x){
  x = x || {};
  const g = $("#gate"), c = $("#gcard");
  if (!v) { g.hidden = true; return; }
  g.hidden = false; c.className = "gcard" + (v === "plans" ? " wide" : "");
  const logo = `<a class="logo" href="../"><img src="../img/logo.svg" alt="">Cotescope</a>`;
  if (v === "loading") { c.innerHTML = logo + `<div class="loader"><div class="scan">${spec([.47,.26,.27])}</div><div>${esc(x.text||"")}</div><small class="note">Le premier chargement prend quelques secondes.</small></div>`; return; }
  if (v === "error") { c.innerHTML = logo + `<div class="panel gbox" style="text-align:center"><h2>Oups</h2><p>${esc(errMsg(x.reason))}</p><button class="btn go" data-reload>Réessayer</button></div>`; return; }
  if (v === "login") c.innerHTML = logo + `<div class="panel gbox"><h2>Connexion</h2><p>Content de te revoir.</p>
      ${field("g-em","E-mail","email","toi@exemple.fr")}${field("g-pw","Mot de passe","password")}
      <div class="msg" id="g-msg"></div><button class="btn go" id="g-go" style="width:100%">Se connecter</button>
      <div class="alt"><button data-gv="forgot">Mot de passe oublié ?</button></div>
      <div class="alt">Pas encore de compte ? <button data-gv="signup">Créer un compte gratuit</button></div></div>`;
  else if (v === "signup") c.innerHTML = logo + `<div class="panel gbox"><h2>Créer mon compte</h2><p>Gratuit, sans carte bancaire et sans limite de durée.</p>
      ${field("g-em","E-mail","email","toi@exemple.fr")}${field("g-pw2","Mot de passe","password","8 caractères minimum")}
      <label class="chk"><input type="checkbox" id="g-ok"><span>J'ai 18 ans ou plus et j'accepte les <a href="../cgv.html" target="_blank">conditions de vente</a>.</span></label>
      <div class="msg" id="g-msg"></div><button class="btn go" id="g-go" style="width:100%">Créer mon compte</button>
      <div class="alt">Déjà un compte ? <button data-gv="login">Se connecter</button></div></div>`;
  else if (v === "forgot") c.innerHTML = logo + `<div class="panel gbox"><h2>Mot de passe oublié</h2><p>On t'envoie un lien pour en choisir un nouveau.</p>
      ${field("g-em","E-mail","email","toi@exemple.fr")}<div class="msg" id="g-msg"></div><button class="btn go" id="g-go" style="width:100%">Envoyer le lien</button>
      <div class="alt"><button data-gv="login">Retour à la connexion</button></div></div>`;
  else if (v === "reset") c.innerHTML = logo + `<div class="panel gbox"><h2>Nouveau mot de passe</h2><p>Choisis un nouveau mot de passe.</p>
      ${field("g-pw2","Nouveau mot de passe","password","8 caractères minimum")}<div class="msg" id="g-msg"></div><button class="btn go" id="g-go" style="width:100%">Enregistrer</button></div>`;
  else if (v === "wait") c.innerHTML = logo + `<div class="panel gbox" style="text-align:center"><h2>Activation du forfait</h2><p>Ton paiement est en cours de validation. Ton forfait s'active tout seul.</p>
      <div class="scan" style="margin:0 auto 18px">${spec([.47,.26,.27])}</div><div class="msg ok" id="g-msg"></div><button class="btn go" id="g-go">Vérifier maintenant</button></div>`;
  else if (v === "plans") {
    const cur = ACCOUNT && ACCOUNT.tier && ACCOUNT.tier !== "gratuit" ? ACCOUNT.tier : null;
    const free = ACCOUNT && ACCOUNT.tier === "gratuit", over = ACCOUNT && !ACCOUNT.tier;
    c.innerHTML = logo + `<div style="text-align:center;margin-bottom:22px"><h2 style="font-family:var(--disp);font-size:28px">${over?"Ta version gratuite est terminée":"Choisis ton forfait"}</h2>
      <p class="note" style="font-size:15px">${free?`Tu es en version gratuite (sans limite de durée). `:""}Paiement mensuel par carte, sans engagement, annulable en un clic.</p></div>
      <div class="plans">${PLANS.map(p => `<div class="panel pl ${p.hot?"hot":""} ${cur===p.id?"cur":""}">${p.hot?`<span class="tag">${p.hot}</span>`:""}
        <h3>${p.name}</h3><div class="pr">${p.price} €<small> / mois</small></div>
        <ul>${p.feats.map(f => `<li class="${/^Tout /.test(f)?"inc":""}">${esc(f)}</li>`).join("")}</ul>
        ${cur===p.id ? `<button class="btn" disabled>Ton forfait actuel</button>` : `<button class="btn ${p.hot?"go":""}" data-buy="${p.id}">Choisir ${p.name}</button>`}</div>`).join("")}</div>
      <div class="msg" id="g-msg" style="text-align:center;color:var(--bad);margin-top:14px"></div>
      <p class="note" style="text-align:center;margin-top:8px">Paiement sécurisé par Whop : Cotescope ne voit jamais tes coordonnées bancaires.${cur?" Pour changer de forfait, annule d'abord l'actuel dans « Gérer mon abonnement ».":""}</p>
      <div style="text-align:center;margin-top:14px">${web || window.__BRIDGE__ ? `<button class="btn" data-gv="close">Retour</button>` : `<button class="btn" id="g-out">Se déconnecter</button>`}</div>`;
  }
  else if (v === "books") c.innerHTML = logo + `<div class="panel gbox"><h2>Où paries-tu ?</h2><p>Coche tous tes bookmakers : chaque pari prendra la meilleure cote parmi eux.</p>
      <div class="books" id="g-books">${BOOKS.map(([k,n]) => `<label><input type="checkbox" value="${k}">${n}</label>`).join("")}</div>
      <div class="msg" id="g-msg"></div><button class="btn go" id="g-go" style="width:100%">Valider</button></div>`;
  const go = $("#g-go"), msg = $("#g-msg");
  const busy = t => { if (!go) return; if (t) { go.dataset.t = go.dataset.t || go.textContent; go.textContent = t; go.disabled = true; } else { if (go.dataset.t) go.textContent = go.dataset.t; go.disabled = false; } };
  const after = async r => {
    if (!r || !r.ok) { msg.textContent = errMsg((r && r.reason) || "network"); return; }
    if (!r.tier) { gate("plans"); return; }
    await start();
  };
  if (v === "books") $$("#g-books input").forEach(i => i.onchange = () => i.parentNode.classList.toggle("on", i.checked));
  if (go) go.onclick = async () => {
    msg.textContent = ""; msg.classList.remove("ok");
    try {
      if (v === "login") { busy("Connexion…"); await after(await Auth.login($("#g-em").value.trim(), $("#g-pw").value)); }
      else if (v === "signup") { if (!$("#g-ok").checked) { msg.textContent = "Coche la case pour continuer."; return; } busy("Création…"); await after(await Auth.signup($("#g-em").value.trim(), $("#g-pw2").value)); }
      else if (v === "forgot") { busy("Envoi…"); const r = await Auth.forgot($("#g-em").value.trim()); if (r.ok) { msg.classList.add("ok"); msg.textContent = "Si un compte existe, un e-mail vient de partir. Regarde aussi tes spams."; } else msg.textContent = errMsg(r.reason); }
      else if (v === "reset") { busy("Enregistrement…"); const r = await Auth.reset(x.code, $("#g-pw2").value); if (r.ok) history.replaceState(null, "", location.pathname); await after(r); }
      else if (v === "wait") { busy("Vérification…"); const r = await Auth.me(true); if (r.ok && r.tier && r.tier !== "gratuit") await start(); else { msg.classList.add("ok"); msg.textContent = "Paiement pas encore reçu, ça peut prendre une minute."; } }
      else if (v === "books") { const L = $$("#g-books input").filter(i => i.checked).flatMap(i => i.value.split(",")); if (!L.length) { msg.textContent = "Coche au moins un bookmaker."; return; } call("set_books", L); gate(null); render(); toast("C'est parti !"); }
    } finally { busy(""); }
  };
  if (v === "wait") { let n = 0; const t = setInterval(async () => { if (++n > 60 || $("#gate").hidden) return clearInterval(t); const r = await Auth.me(true); if (r.ok && r.tier && r.tier !== "gratuit") { clearInterval(t); await start(); } }, 5000); }
  c.querySelectorAll("input.in").forEach(i => i.onkeydown = e => { if (e.key === "Enter" && go) go.click(); });
  const f = c.querySelector("input.in"); if (f) setTimeout(() => f.focus(), 50);
  const o = $("#g-out"); if (o) o.onclick = Auth.logout;
}
document.addEventListener("click", async e => {
  const v = e.target.closest("[data-gv]");
  if (v) { if (v.dataset.gv === "close") gate(null); else gate(v.dataset.gv); }
  const b = e.target.closest("[data-buy]");
  if (b) { b.disabled = true; const r = await Auth.checkout(b.dataset.buy); b.disabled = false;
    if (!r.ok) { const m = $("#g-msg"); if (m) m.textContent = r.reason === "whop_error" ? `Le paiement a été refusé par Whop (code ${r.status}). Détail : ${String(r.detail || "").slice(0, 160)}` : errMsg(r.reason); } }
});

let VERIFIED_MSG = "";
function verifyBanner(){
  if (!ACCOUNT || ACCOUNT.verified !== false) return "";
  return `<div class="banner vbanner">📩 Confirme ton adresse e-mail : on t'a envoyé un lien à <b>${esc(ACCOUNT.email)}</b> (regarde aussi dans les spams).<button class="btn sm" data-vresend>Renvoyer l'e-mail</button></div>`;
}
document.addEventListener("click", async e => {
  if (!e.target.closest("[data-vresend]")) return;
  const r = await Auth.verifyResend();
  toast(r.ok ? (r.already ? "Ton adresse est déjà confirmée" : "E-mail renvoyé : regarde ta boîte de réception") : r.reason === "too_many" ? "Trop de demandes, réessaie dans 15 minutes" : r.reason === "mail_not_configured" ? "L'envoi d'e-mails n'est pas encore activé, réessaie plus tard" : "L'envoi a échoué, réessaie");
});
async function start(){
  try {
    if (!window.__BRIDGE__) await boot();
    else SPINFO = call("set_sport", SPORT) || {};
    gate(null);
    if (!location.hash.startsWith("#/")) location.hash = "/matchs";
    render();
    if (VERIFIED_MSG) { toast(VERIFIED_MSG === "ok" ? "✅ Adresse e-mail confirmée, merci !" : "Ce lien de confirmation n'est plus valable : renvoie-en un depuis la bannière"); if (VERIFIED_MSG === "ok" && ACCOUNT) ACCOUNT.verified = true; VERIFIED_MSG = ""; render(); }
    const cfg = call("get_config") || {};
    if (!cfg.books_chosen) gate("books");
  } catch(e) {
    const r = e.reason || e.message;
    if (["no_plan","inactive","free_over"].includes(r)) gate("plans");
    else if (r === "session") gate("login");
    else gate("error", {reason: r});
  }
}

async function init(){
  if (window.__BRIDGE__) { ACCOUNT = window.__BRIDGE_ACCOUNT__ || {email:"test@cotescope.fr", tier:"elite"}; return start(); }
  try { CFG = await (await fetch("../config.json", {cache:"no-store"})).json(); } catch(e) { CFG = {}; }
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("reset")) return gate("reset", {code: h.get("reset")});
  if (h.has("verified")) { VERIFIED_MSG = h.get("verified") === "1" ? "ok" : "bad"; history.replaceState(null, "", location.pathname); }
  const paid = location.hash === "#paid";
  if (paid) history.replaceState(null, "", location.pathname);
  SESSION = lsGet();
  if (!SESSION) return gate(h.has("signup") || location.hash === "#signup" ? "signup" : "login");
  gate("loading", {text:"Connexion à ton compte…"});
  const me = await Auth.me(true);
  if (!me.ok) return gate(me.reason === "network" ? "error" : "login", {reason: me.reason});
  if (!me.tier) return gate(paid ? "wait" : "plans");
  if (paid && me.tier === "gratuit") return gate("wait");
  await start();
}
init();
</script>
